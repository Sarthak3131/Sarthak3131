<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Dark Mode Base -->
    <rect id="base" width="1200" height="400" fill="#0A0A0A" />

    <!-- Ambient Mesh Gradients -->
    <radialGradient id="blob1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="blob2" cx="70%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="blob3" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0" />
    </radialGradient>

    <!-- Heavy Blur for liquid blending -->
    <filter id="mesh-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <use href="#base" />

  <!-- Animated Mesh Container -->
  <g filter="url(#mesh-blur)">
    <!-- Cyan/Blue Left -->
    <circle cx="300" cy="150" r="400" fill="url(#blob1)">
      <animate attributeName="cx" values="300;450;300" dur="20s" repeatCount="indefinite" keySplines="0.25 0.1 0.25 1.0" calcMode="spline" />
      <animate attributeName="cy" values="150;50;150" dur="24s" repeatCount="indefinite" keySplines="0.25 0.1 0.25 1.0" calcMode="spline" />
    </circle>
    
    <!-- Deep Blue Right -->
    <circle cx="900" cy="250" r="500" fill="url(#blob2)">
      <animate attributeName="cx" values="900;750;900" dur="22s" repeatCount="indefinite" keySplines="0.25 0.1 0.25 1.0" calcMode="spline" />
      <animate attributeName="cy" values="250;350;250" dur="18s" repeatCount="indefinite" keySplines="0.25 0.1 0.25 1.0" calcMode="spline" />
    </circle>
    
    <!-- Purple Bottom Center -->
    <circle cx="600" cy="400" r="300" fill="url(#blob3)">
      <animate attributeName="cx" values="600;700;500;600" dur="26s" repeatCount="indefinite" keySplines="0.25 0.1 0.25 1.0; 0.25 0.1 0.25 1.0; 0.25 0.1 0.25 1.0" calcMode="spline" />
      <animate attributeName="cy" values="400;300;400" dur="20s" repeatCount="indefinite" keySplines="0.25 0.1 0.25 1.0" calcMode="spline" />
    </circle>
  </g>
  
  <!-- Faint star-like noise / particles for premium depth -->
  <!-- Note: SVG doesn't support noise textures easily without base64 or heavy filters, so we'll use tiny static elements with pulsing opacities -->
  <g opacity="0.4">
    <circle cx="150" cy="80" r="1" fill="#FFF">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="850" cy="120" r="1.5" fill="#FFF">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="450" cy="320" r="1" fill="#FFF">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="280" r="2" fill="#FFF">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
