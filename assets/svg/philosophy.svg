<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350">
  <defs>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="icon-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="icon-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A67C00" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="ambient-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <rect width="1000" height="350" rx="24" fill="#0A0A0A" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2" />

  <!-- Animated Ambient Background Blobs -->
  <g filter="url(#ambient-blur)" opacity="0.6">
    <circle cx="200" cy="175" r="150" fill="url(#icon-grad-1)" opacity="0.15">
      <animate attributeName="cx" values="200; 300; 200" dur="14s" repeatCount="indefinite" keySplines="0.25 0.1 0.25 1.0" calcMode="spline" />
    </circle>
    <circle cx="800" cy="175" r="150" fill="url(#icon-grad-2)" opacity="0.1">
      <animate attributeName="cx" values="800; 700; 800" dur="18s" repeatCount="indefinite" keySplines="0.25 0.1 0.25 1.0" calcMode="spline" />
    </circle>
  </g>

  <!-- The Main Card -->
  <g transform="translate(50, 40)" filter="url(#shadow)">
    <rect width="900" height="260" rx="16" fill="url(#glass)" stroke="url(#border)" stroke-width="1.5" />
    
    <!-- Title -->
    <text x="40" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#FFD700" font-weight="600" letter-spacing="2">ENGINEERING PHILOSOPHY</text>
    <text x="40" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" fill="#EDEDED" font-weight="700">Designing for reliability and scale.</text>

    <!-- Divider -->
    <line x1="40" y1="120" x2="860" y2="120" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

    <!-- Three Pillars -->
    <!-- Pillar 1 -->
    <g transform="translate(40, 150)">
      <animateTransform attributeName="transform" type="translate" values="40,150; 40,147; 40,150" dur="8s" repeatCount="indefinite" keySplines="0.25 0.1 0.25 1.0; 0.25 0.1 0.25 1.0" calcMode="spline" />
      <rect width="40" height="40" rx="12" fill="url(#icon-grad-1)" fill-opacity="0.1" stroke="url(#icon-grad-1)" stroke-width="1" />
      <!-- DB/System Icon -->
      <path d="M12,14 C12,11 28,11 28,14 C28,17 12,17 12,14 Z M12,20 C12,23 28,23 28,20 M12,26 C12,29 28,29 28,26 M12,14 V26 M28,14 V26" fill="none" stroke="url(#icon-grad-1)" stroke-width="1.5" stroke-linejoin="round" />
      
      <text x="56" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#EDEDED" font-weight="600">System Design First</text>
      <text x="56" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#E2E8F0">Architecture mapped to</text>
      <text x="56" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#E2E8F0">real domain constraints.</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(340, 150)">
      <animateTransform attributeName="transform" type="translate" values="340,150; 340,146; 340,150" dur="10s" repeatCount="indefinite" keySplines="0.25 0.1 0.25 1.0; 0.25 0.1 0.25 1.0" calcMode="spline" />
      <rect width="40" height="40" rx="12" fill="url(#icon-grad-2)" fill-opacity="0.1" stroke="url(#icon-grad-2)" stroke-width="1" />
      <!-- Shield/Correctness Icon -->
      <path d="M20,10 L12,14 V20 C12,25 15,29 20,32 C25,29 28,25 28,20 V14 Z M16,22 L19,25 L24,18" fill="none" stroke="url(#icon-grad-2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <text x="56" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#EDEDED" font-weight="600">Backend Correctness</text>
      <text x="56" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#E2E8F0">Controlled state transitions</text>
      <text x="56" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#E2E8F0">over loose flag updates.</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(640, 150)">
      <animateTransform attributeName="transform" type="translate" values="640,150; 640,148; 640,150" dur="9s" repeatCount="indefinite" keySplines="0.25 0.1 0.25 1.0; 0.25 0.1 0.25 1.0" calcMode="spline" />
      <rect width="40" height="40" rx="12" fill="url(#icon-grad-1)" fill-opacity="0.1" stroke="url(#icon-grad-1)" stroke-width="1" />
      <!-- API/Network Icon -->
      <path d="M20,12 A4,4 0 1,1 20,11.99 M20,16 V24 M12,28 A4,4 0 1,1 12,27.99 M28,28 A4,4 0 1,1 28,27.99 M20,24 L14,26 M20,24 L26,26" fill="none" stroke="url(#icon-grad-1)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <text x="56" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#EDEDED" font-weight="600">Explicit API Boundaries</text>
      <text x="56" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#E2E8F0">Clear contracts to reduce</text>
      <text x="56" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#E2E8F0">frontend ambiguity.</text>
    </g>

  </g>
</svg>
