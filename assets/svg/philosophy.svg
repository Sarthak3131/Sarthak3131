<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350">
  <defs>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="icon-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23C4FF" />
      <stop offset="100%" stop-color="#1A4DFF" />
    </linearGradient>
    <linearGradient id="icon-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#1A4DFF" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1000" height="350" fill="#0A0A0A" />

  <!-- The Main Card -->
  <g transform="translate(50, 40)" filter="url(#shadow)">
    <rect width="900" height="260" rx="16" fill="url(#glass)" stroke="url(#border)" stroke-width="1.5" />
    
    <!-- Title -->
    <text x="40" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#23C4FF" font-weight="600" letter-spacing="2">ENGINEERING PHILOSOPHY</text>
    <text x="40" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" fill="#EDEDED" font-weight="700">Designing for reliability and scale.</text>

    <!-- Divider -->
    <line x1="40" y1="120" x2="860" y2="120" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

    <!-- Three Pillars -->
    <!-- Pillar 1 -->
    <g transform="translate(40, 150)">
      <rect width="40" height="40" rx="12" fill="url(#icon-grad-1)" fill-opacity="0.1" stroke="url(#icon-grad-1)" stroke-width="1" />
      <!-- DB/System Icon -->
      <path d="M12,14 C12,11 28,11 28,14 C28,17 12,17 12,14 Z M12,20 C12,23 28,23 28,20 M12,26 C12,29 28,29 28,26 M12,14 V26 M28,14 V26" fill="none" stroke="url(#icon-grad-1)" stroke-width="1.5" stroke-linejoin="round" />
      
      <text x="56" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#EDEDED" font-weight="600">System Design First</text>
      <text x="56" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#A1A1AA">Architecture mapped to real domain constraints.</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(340, 150)">
      <rect width="40" height="40" rx="12" fill="url(#icon-grad-2)" fill-opacity="0.1" stroke="url(#icon-grad-2)" stroke-width="1" />
      <!-- Shield/Correctness Icon -->
      <path d="M20,10 L12,14 V20 C12,25 15,29 20,32 C25,29 28,25 28,20 V14 Z M16,22 L19,25 L24,18" fill="none" stroke="url(#icon-grad-2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <text x="56" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#EDEDED" font-weight="600">Backend Correctness</text>
      <text x="56" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#A1A1AA">Controlled state transitions over loose flag updates.</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(640, 150)">
      <rect width="40" height="40" rx="12" fill="url(#icon-grad-1)" fill-opacity="0.1" stroke="url(#icon-grad-1)" stroke-width="1" />
      <!-- API/Network Icon -->
      <path d="M20,12 A4,4 0 1,1 20,11.99 M20,16 V24 M12,28 A4,4 0 1,1 12,27.99 M28,28 A4,4 0 1,1 28,27.99 M20,24 L14,26 M20,24 L26,26" fill="none" stroke="url(#icon-grad-1)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <text x="56" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#EDEDED" font-weight="600">Explicit API Boundaries</text>
      <text x="56" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#A1A1AA">Clear contracts to reduce frontend ambiguity.</text>
    </g>

  </g>
</svg>
