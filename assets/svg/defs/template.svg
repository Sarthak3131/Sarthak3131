<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23C4FF" />
      <stop offset="100%" stop-color="#1A4DFF" />
    </linearGradient>
    
    <linearGradient id="purple-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#1A4DFF" />
    </linearGradient>

    <!-- Glassmorphism Border Gradient -->
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.2)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="shadow-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#23C4FF" flood-opacity="0.5" />
    </filter>

    <!-- Blurs -->
    <filter id="blur-glass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
    
    <filter id="blur-ambient" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32" />
    </filter>

    <!-- Reusable Glass Card Mask / Rect (Example) -->
    <!-- Usage: <rect width="100" height="100" rx="12" fill="rgba(255,255,255,0.03)" stroke="url(#glass-border)" stroke-width="1" filter="url(#shadow-soft)" /> -->
  </defs>
</svg>
