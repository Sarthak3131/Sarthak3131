<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Colors -->
    <rect id="base" width="1200" height="400" fill="#0A0A0A" />

    <!-- Brand Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#23C4FF" />
      <stop offset="100%" stop-color="#1A4DFF" />
    </linearGradient>

    <linearGradient id="pill-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(35, 196, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(26, 77, 255, 0.1)" />
    </linearGradient>

    <!-- Mesh Gradients for background -->
    <radialGradient id="blob1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1A4DFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1A4DFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blob2" cx="70%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#23C4FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#23C4FF" stop-opacity="0" />
    </radialGradient>
    <filter id="mesh-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <use href="#base" />

  <!-- Animated Mesh Container -->
  <g filter="url(#mesh-blur)">
    <circle cx="300" cy="150" r="400" fill="url(#blob1)">
      <animate attributeName="cx" values="300;450;300" dur="20s" repeatCount="indefinite" keySplines="0.25 0.1 0.25 1.0" calcMode="spline" />
      <animate attributeName="cy" values="150;50;150" dur="24s" repeatCount="indefinite" keySplines="0.25 0.1 0.25 1.0" calcMode="spline" />
    </circle>
    <circle cx="900" cy="250" r="500" fill="url(#blob2)">
      <animate attributeName="cx" values="900;750;900" dur="22s" repeatCount="indefinite" keySplines="0.25 0.1 0.25 1.0" calcMode="spline" />
      <animate attributeName="cy" values="250;350;250" dur="18s" repeatCount="indefinite" keySplines="0.25 0.1 0.25 1.0" calcMode="spline" />
    </circle>
  </g>

  <!-- Typography & Layout Group -->
  <!-- Centered Layout, massive whitespace -->
  <g transform="translate(600, 200)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    
    <!-- Top Pill -->
    <g transform="translate(0, -80)">
      <rect x="-100" y="-16" width="200" height="32" rx="16" fill="#111111" stroke="url(#pill-border)" stroke-width="1.5" />
      <circle cx="-80" cy="0" r="4" fill="#23C4FF" />
      <text x="10" y="4" font-size="12" fill="#EDEDED" font-weight="500" letter-spacing="1">SOFTWARE ENGINEER</text>
    </g>

    <!-- Main Title -->
    <!-- Using standard text but mimicking a gradient clip via masking (if needed) or just solid pristine white to gray -->
    <text x="0" y="-10" font-size="64" font-weight="800" fill="url(#text-grad)" letter-spacing="-1.5">Sarthak Srivastava</text>

    <!-- Subtitle -->
    <text x="0" y="40" font-size="20" font-weight="400" fill="#A1A1AA" letter-spacing="0.5">Architecting reliable systems, clean APIs, and</text>
    <text x="0" y="70" font-size="20" font-weight="400" fill="#A1A1AA" letter-spacing="0.5">scalable backend infrastructure.</text>

    <!-- Subtle separator or accent line -->
    <rect x="-40" y="110" width="80" height="2" fill="url(#accent-grad)" rx="1" />
  </g>

</svg>
