<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <!-- Background Gradient representing depth -->
    <radialGradient id="bg-glow" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#1A4DFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </radialGradient>

    <!-- Glassmorphism Surface -->
    <linearGradient id="glass-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <!-- Premium Glass Border -->
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>

    <!-- Soft Drop Shadow for Depth -->
    <filter id="shadow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="blur-glass">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Global Base Background (simulate the profile background) -->
  <rect width="800" height="400" fill="url(#bg-glow)" />

  <!-- Animated Floating Orb behind the glass -->
  <circle cx="200" cy="150" r="80" fill="#7928CA" filter="url(#blur-glass)" opacity="0.4">
    <animate attributeName="cy" values="150;130;150" dur="8s" repeatCount="indefinite" keySplines="0.25 0.1 0.25 1.0" calcMode="spline"/>
    <animate attributeName="cx" values="200;220;200" dur="12s" repeatCount="indefinite" keySplines="0.25 0.1 0.25 1.0" calcMode="spline"/>
  </circle>

  <circle cx="600" cy="250" r="100" fill="#23C4FF" filter="url(#blur-glass)" opacity="0.3">
    <animate attributeName="cy" values="250;270;250" dur="10s" repeatCount="indefinite" keySplines="0.25 0.1 0.25 1.0" calcMode="spline"/>
  </circle>

  <!-- The Glass Card Itself -->
  <g transform="translate(100, 50)" filter="url(#shadow-soft)">
    <!-- Base Glass Fill -->
    <rect width="600" height="300" rx="16" fill="url(#glass-surface)" />
    <!-- Glass Border Overlay (Simulated via 1px stroke inside) -->
    <rect width="600" height="300" rx="16" fill="none" stroke="url(#glass-border)" stroke-width="1.5" />
    
    <!-- Placeholder Typography to show off layout rules -->
    <text x="48" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#EDEDED">Premium Glass Component</text>
    <text x="48" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#A1A1AA" font-weight="400">Soft shadows, dynamic lighting, and liquid motion.</text>
    
    <!-- Mini floating pill inside the card -->
    <g transform="translate(48, 140)">
      <rect width="140" height="32" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
      <text x="70" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#23C4FF" font-weight="500" text-anchor="middle">Hover state ready</text>
    </g>
  </g>
</svg>
