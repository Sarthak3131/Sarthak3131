<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="glass-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#23C4FF" />
      <stop offset="100%" stop-color="#1A4DFF" />
    </linearGradient>
    
    <filter id="shadow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Global Base Background -->
  <rect width="1000" height="500" rx="24" fill="#0A0A0A" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2" />

  <!-- Main Glass Card -->
  <g transform="translate(40, 40)" filter="url(#shadow-soft)">
    <rect width="920" height="420" rx="20" fill="url(#glass-bg)" stroke="url(#glass-border)" stroke-width="1.5" />
    
    <!-- Header Area -->
    <rect x="40" y="40" width="6" height="24" rx="3" fill="url(#accent-cyan)" />
    <text x="60" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#EDEDED">PPSP ERP System</text>
    <text x="60" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#23C4FF" letter-spacing="1">PRODUCTION SCHEDULING &amp; RESOURCE PLANNING</text>

    <!-- Left Column: Content (x=60, width=400) -->
    <g transform="translate(60, 120)">
      <!-- Overview -->
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#71717A" letter-spacing="1">OVERVIEW</text>
      <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">A centralized web-based platform managing</text>
      <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">inventory, BOM administration, and production cycles.</text>

      <!-- Challenge -->
      <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#71717A" letter-spacing="1">CHALLENGE</text>
      <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">Enforcing strict departmental data isolation while</text>
      <text x="0" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">maintaining a continuous, synchronized order flow.</text>

      <!-- Engineering Decisions -->
      <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#71717A" letter-spacing="1">ENGINEERING DECISIONS</text>
      <text x="0" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">Implemented role-aware API boundaries with Laravel</text>
      <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">Sanctum, decoupling the UI via React.js and Vite.</text>

      <!-- Trade-offs -->
      <text x="0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#71717A" letter-spacing="1">TRADE-OFFS</text>
      <text x="0" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">Chose a modular monolith over microservices to</text>
      <text x="0" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">reduce infrastructure overhead while keeping speed.</text>
    </g>

    <!-- Tech Stack Pills -->
    <g transform="translate(60, 360)">
      <rect x="0" y="0" width="60" height="24" rx="12" fill="url(#accent-cyan)" fill-opacity="0.1" stroke="url(#accent-cyan)" stroke-width="1" />
      <text x="30" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#23C4FF" text-anchor="middle">Laravel</text>

      <rect x="70" y="0" width="70" height="24" rx="12" fill="#1A4DFF" fill-opacity="0.1" stroke="#1A4DFF" stroke-width="1" />
      <text x="105" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#79A2FF" text-anchor="middle">React.js</text>

      <rect x="150" y="0" width="56" height="24" rx="12" fill="#7928CA" fill-opacity="0.1" stroke="#7928CA" stroke-width="1" />
      <text x="178" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#D892FF" text-anchor="middle">MySQL</text>

      <rect x="216" y="0" width="68" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
      <text x="250" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#EDEDED" text-anchor="middle">Sanctum</text>
    </g>

    <!-- Right Column: Animated Architecture Diagram -->
    <g id="animated-architecture" transform="translate(500, 60)">
      <!-- Base container for diagram -->
      <rect width="380" height="340" rx="16" fill="#111111" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1" />
      
      <!-- Paths / Connections -->
      <path id="path-ui-auth" d="M190,40 L190,100" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="4,4" />
      <path id="path-auth-api" d="M190,140 L190,200" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" />
      
      <path id="path-api-db1" d="M150,240 L90,280" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" />
      <path id="path-api-db2" d="M230,240 L290,280" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" />

      <!-- Animated Data Packets -->
      <circle r="3" fill="#23C4FF" filter="url(#shadow-soft)">
        <animateMotion dur="2s" repeatCount="indefinite" path="M190,40 L190,100" />
      </circle>
      <circle r="3" fill="#7928CA" filter="url(#shadow-soft)">
        <animateMotion dur="2.5s" repeatCount="indefinite" path="M190,140 L190,200" />
      </circle>
      <circle r="3" fill="#1A4DFF" filter="url(#shadow-soft)">
        <animateMotion dur="1.5s" repeatCount="indefinite" path="M150,240 L90,280" />
      </circle>
      <circle r="3" fill="#1A4DFF" filter="url(#shadow-soft)">
        <animateMotion dur="1.8s" repeatCount="indefinite" path="M230,240 L290,280" />
      </circle>

      <!-- Nodes -->
      <!-- UI Node -->
      <g transform="translate(130, 10)">
        <rect width="120" height="30" rx="8" fill="#1A4DFF" fill-opacity="0.1" stroke="#1A4DFF" stroke-width="1" />
        <text x="60" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#79A2FF" font-weight="600" text-anchor="middle">React Client</text>
      </g>

      <!-- Auth Node -->
      <g transform="translate(120, 100)">
        <rect width="140" height="40" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
        <text x="70" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#EDEDED" font-weight="600" text-anchor="middle">Sanctum Middleware</text>
      </g>

      <!-- API Node -->
      <g transform="translate(110, 200)">
        <rect width="160" height="40" rx="12" fill="url(#accent-cyan)" fill-opacity="0.15" stroke="url(#accent-cyan)" stroke-width="1" />
        <text x="80" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#23C4FF" font-weight="600" text-anchor="middle">Laravel Monolith API</text>
      </g>

      <!-- DB Node 1 (BOM) -->
      <g transform="translate(40, 280)">
        <rect width="100" height="40" rx="12" fill="#7928CA" fill-opacity="0.1" stroke="#7928CA" stroke-width="1" />
        <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#D892FF" font-weight="600" text-anchor="middle">BOM Data</text>
      </g>

      <!-- DB Node 2 (Inventory) -->
      <g transform="translate(240, 280)">
        <rect width="100" height="40" rx="12" fill="#7928CA" fill-opacity="0.1" stroke="#7928CA" stroke-width="1" />
        <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#D892FF" font-weight="600" text-anchor="middle">Inventory</text>
      </g>

    </g>
  </g>
</svg>
