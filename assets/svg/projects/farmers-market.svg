<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <defs>
    <linearGradient id="glass-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#1A4DFF" />
    </linearGradient>
    
    <filter id="shadow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="1000" height="480" rx="24" fill="#0A0A0A" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2" />

  <g transform="translate(40, 40)" filter="url(#shadow-soft)">
    <rect width="920" height="400" rx="20" fill="url(#glass-bg)" stroke="url(#glass-border)" stroke-width="1.5" />
    
    <!-- Header Area -->
    <rect x="40" y="40" width="6" height="24" rx="3" fill="url(#accent-green)" />
    <text x="60" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#EDEDED">Digital Farmers Market</text>
    <text x="60" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#22C55E" letter-spacing="1">ROLE-AWARE MERN MARKETPLACE</text>

    <!-- Left Column: Content -->
    <g transform="translate(60, 120)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#71717A" letter-spacing="1">OVERVIEW</text>
      <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">A full-stack eCommerce platform connecting farmers</text>
      <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">and customers with role-specific dashboards.</text>

      <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#71717A" letter-spacing="1">CHALLENGE</text>
      <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">Enforcing strict boundaries for product listings, orders,</text>
      <text x="0" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">and cart sessions across three distinct user roles.</text>

      <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#71717A" letter-spacing="1">ENGINEERING DECISIONS</text>
      <text x="0" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">Implemented a robust JWT-based authorization layer in</text>
      <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">Express.js middleware to centralize access control logic.</text>

      <text x="0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#71717A" letter-spacing="1">TRADE-OFFS</text>
      <text x="0" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">Offloading sessions to stateless JWTs improved API</text>
      <text x="0" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">scaling at the cost of immediate token revocation complexity.</text>
    </g>

    <!-- Tech Stack Pills -->
    <g transform="translate(60, 340)">
      <rect x="0" y="0" width="76" height="24" rx="12" fill="#22C55E" fill-opacity="0.1" stroke="#22C55E" stroke-width="1" />
      <text x="38" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#4ADE80" text-anchor="middle">MongoDB</text>

      <rect x="86" y="0" width="80" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
      <text x="126" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#EDEDED" text-anchor="middle">Express.js</text>

      <rect x="176" y="0" width="60" height="24" rx="12" fill="#1A4DFF" fill-opacity="0.1" stroke="#1A4DFF" stroke-width="1" />
      <text x="206" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#79A2FF" text-anchor="middle">React</text>

      <rect x="246" y="0" width="70" height="24" rx="12" fill="#22C55E" fill-opacity="0.1" stroke="#22C55E" stroke-width="1" />
      <text x="281" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#4ADE80" text-anchor="middle">Node.js</text>
      
      <rect x="326" y="0" width="50" height="24" rx="12" fill="#7928CA" fill-opacity="0.1" stroke="#7928CA" stroke-width="1" />
      <text x="351" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#D892FF" text-anchor="middle">JWT</text>
    </g>

    <!-- Right Column: Animated Architecture Diagram Placeholder -->
    <g id="animated-architecture" transform="translate(500, 60)">
      <rect width="380" height="300" rx="16" fill="#111111" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1" />
      
      <!-- Base Nodes -->
      <g transform="translate(140, 20)">
        <rect width="100" height="30" rx="8" fill="#1A4DFF" fill-opacity="0.1" stroke="#1A4DFF" stroke-width="1" />
        <text x="50" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#79A2FF" font-weight="600" text-anchor="middle">React Client</text>
      </g>

      <g transform="translate(120, 100)">
        <rect width="140" height="40" rx="12" fill="#7928CA" fill-opacity="0.1" stroke="#7928CA" stroke-width="1" />
        <text x="70" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#D892FF" font-weight="600" text-anchor="middle">JWT Middleware</text>
      </g>

      <g transform="translate(40, 180)">
        <rect width="80" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
        <text x="40" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#A1A1AA" font-weight="600" text-anchor="middle">Farmer Auth</text>
      </g>
      
      <g transform="translate(150, 180)">
        <rect width="80" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
        <text x="40" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#A1A1AA" font-weight="600" text-anchor="middle">User Auth</text>
      </g>
      
      <g transform="translate(260, 180)">
        <rect width="80" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
        <text x="40" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#A1A1AA" font-weight="600" text-anchor="middle">Admin Auth</text>
      </g>

      <g transform="translate(140, 250)">
        <rect width="100" height="30" rx="8" fill="#22C55E" fill-opacity="0.1" stroke="#22C55E" stroke-width="1" />
        <text x="50" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4ADE80" font-weight="600" text-anchor="middle">MongoDB</text>
      </g>

      <!-- Connections -->
      <path d="M190,50 L190,100" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" />
      <path d="M190,140 L80,180" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" />
      <path d="M190,140 L190,180" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" />
      <path d="M190,140 L300,180" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" />
      <path d="M80,210 L190,250" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" />
      <path d="M190,210 L190,250" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" />
      <path d="M300,210 L190,250" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" />

      <!-- Animated Data Packets -->
      <circle r="3" fill="#1A4DFF" filter="url(#shadow-soft)">
        <animateMotion dur="2s" repeatCount="indefinite" path="M190,50 L190,100" />
      </circle>
      <circle r="3" fill="#D892FF" filter="url(#shadow-soft)">
        <animateMotion dur="1.5s" repeatCount="indefinite" path="M190,140 L80,180" />
      </circle>
      <circle r="3" fill="#D892FF" filter="url(#shadow-soft)">
        <animateMotion dur="1.7s" repeatCount="indefinite" path="M190,140 L190,180" />
      </circle>
      <circle r="3" fill="#D892FF" filter="url(#shadow-soft)">
        <animateMotion dur="1.4s" repeatCount="indefinite" path="M190,140 L300,180" />
      </circle>
      <circle r="3" fill="#4ADE80" filter="url(#shadow-soft)">
        <animateMotion dur="1.2s" repeatCount="indefinite" path="M80,210 L190,250" />
      </circle>
      <circle r="3" fill="#4ADE80" filter="url(#shadow-soft)">
        <animateMotion dur="1.5s" repeatCount="indefinite" path="M190,210 L190,250" />
      </circle>
      <circle r="3" fill="#4ADE80" filter="url(#shadow-soft)">
        <animateMotion dur="1.3s" repeatCount="indefinite" path="M300,210 L190,250" />
      </circle>
    </g>
  </g>
</svg>
