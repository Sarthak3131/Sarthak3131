<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <defs>
    <linearGradient id="glass-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    
    <filter id="shadow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="1000" height="480" rx="24" fill="transparent" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2" />

  <g transform="translate(40, 40)" filter="url(#shadow-soft)">
    <rect width="920" height="400" rx="20" fill="url(#glass-bg)" stroke="url(#glass-border)" stroke-width="1.5" />
    
    <!-- Header Area -->
    <rect x="40" y="40" width="6" height="24" rx="3" fill="url(#accent-purple)" />
    <text x="60" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#EDEDED">Developer Portfolio</text>
    <text x="60" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#B45309" letter-spacing="1">REAL-TIME API AGGREGATION &amp; SHOWCASE</text>

    <!-- Left Column: Content -->
    <g transform="translate(60, 120)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#71717A" letter-spacing="1">OVERVIEW</text>
      <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">A high-performance personal platform showcasing</text>
      <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">projects and live programming statistics.</text>

      <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#71717A" letter-spacing="1">CHALLENGE</text>
      <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">Aggregating multiple third-party API data streams</text>
      <text x="0" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">without blocking the critical rendering path.</text>

      <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#71717A" letter-spacing="1">ENGINEERING DECISIONS</text>
      <text x="0" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">Built custom REST integration layers to fetch profile</text>
      <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">stats. Used React Router for seamless transitions.</text>


    </g>

    <!-- Tech Stack Pills -->
    <g transform="translate(60, 340)">
      <rect x="0" y="0" width="70" height="24" rx="12" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="1" />
      <text x="35" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#79A2FF" text-anchor="middle">React.js</text>

      <rect x="80" y="0" width="85" height="24" rx="12" fill="#FDE047" fill-opacity="0.1" stroke="#FDE047" stroke-width="1" />
      <text x="122" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#FDE047" text-anchor="middle">Tailwind CSS</text>

      <rect x="175" y="0" width="80" height="24" rx="12" fill="#B45309" fill-opacity="0.1" stroke="#B45309" stroke-width="1" />
      <text x="215" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#D892FF" text-anchor="middle">REST APIs</text>

      <rect x="265" y="0" width="60" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
      <text x="295" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#EDEDED" text-anchor="middle">Netlify</text>
    </g>

    <!-- Right Column: API Integration Diagram -->
    <g transform="translate(500, 60)">
      <rect width="380" height="300" rx="16" fill="#111111" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1" />
      
      <!-- GitHub API Node -->
      <g transform="translate(240, 40)">
        <rect width="100" height="40" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
        <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#EDEDED" font-weight="600" text-anchor="middle">GitHub API</text>
      </g>

      <!-- LeetCode API Node -->
      <g transform="translate(240, 220)">
        <rect width="100" height="40" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
        <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#EDEDED" font-weight="600" text-anchor="middle">LeetCode API</text>
      </g>

      <!-- React UI Node -->
      <g transform="translate(40, 130)">
        <rect width="100" height="40" rx="12" fill="url(#accent-purple)" fill-opacity="0.1" stroke="url(#accent-purple)" stroke-width="1" />
        <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#D892FF" font-weight="600" text-anchor="middle">React SPA</text>
      </g>

      <!-- Connection Lines -->
      <path id="path-github" d="M140,140 L240,60" fill="none" stroke="#B45309" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4,4" />
      <path id="path-leetcode" d="M140,160 L240,240" fill="none" stroke="#B45309" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4,4" />

      <!-- Animated Data Packets -->
      <circle r="3" fill="#D892FF" filter="url(#shadow-soft)">
        <animateMotion dur="2s" begin="-0.6s" repeatCount="indefinite" path="M140,140 L240,60" />
      </circle>
      <circle r="3" fill="#D892FF" filter="url(#shadow-soft)">
        <animateMotion dur="2.5s" begin="-1.2s" repeatCount="indefinite" path="M140,160 L240,240" />
      </circle>
      <!-- Return paths -->
      <circle r="3" fill="#FDE047" filter="url(#shadow-soft)">
        <animateMotion dur="1.8s" begin="-0.3s" repeatCount="indefinite" path="M240,60 L140,140" />
      </circle>
      <circle r="3" fill="#FDE047" filter="url(#shadow-soft)">
        <animateMotion dur="2.2s" begin="-0.9s" repeatCount="indefinite" path="M240,240 L140,160" />
      </circle>
    </g>
  </g>
</svg>
