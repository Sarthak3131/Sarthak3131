<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <defs>
    <linearGradient id="glass-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="accent-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#23C4FF" />
      <stop offset="100%" stop-color="#1A4DFF" />
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23C4FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1A4DFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1A4DFF" stop-opacity="0" />
    </linearGradient>

    <filter id="shadow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glow-node">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="400" fill="#0A0A0A" />

  <!-- Section Title -->
  <text x="50" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#EDEDED">Experience &amp; Education</text>
  <line x1="50" y1="70" x2="950" y2="70" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />

  <g transform="translate(50, 100)">
    <!-- Vertical Timeline Line -->
    <rect x="19" y="10" width="2" height="280" fill="url(#line-grad)" />

    <!-- Animated Timeline Pulse -->
    <circle r="2" fill="#FFFFFF" filter="url(#glow-node)">
      <animateMotion dur="5s" repeatCount="indefinite" path="M20,10 L20,290" keyPoints="0;1" keyTimes="0;1" calcMode="linear" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="5s" repeatCount="indefinite" />
    </circle>

    <!-- Node 1: MedQueue -->
    <g transform="translate(0, 20)">
      <!-- Node Dot -->
      <circle cx="20" cy="20" r="6" fill="#23C4FF" filter="url(#glow-node)" />
      <circle cx="20" cy="20" r="3" fill="#0A0A0A" />
      
      <!-- Date -->
      <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#23C4FF" letter-spacing="1">JUN 2024 — SEP 2024</text>
      
      <!-- Content Card -->
      <g transform="translate(50, 40)" filter="url(#shadow-soft)">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="6s" repeatCount="indefinite" />
        <rect width="800" height="90" rx="12" fill="url(#glass-bg)" stroke="url(#glass-border)" stroke-width="1" />
        <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#EDEDED">Frontend Developer Intern</text>
        <text x="245" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#71717A">@ MedQueue</text>
        
        <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">Developed scalable React UIs for real-time OPD queue systems managing 500+ daily patients.</text>
        <text x="24" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">Refactored legacy logic into functional components, cutting UI load time by 30%.</text>
      </g>
    </g>

    <!-- Node 2: LPU -->
    <g transform="translate(0, 160)">
      <!-- Node Dot -->
      <circle cx="20" cy="20" r="6" fill="#1A4DFF" filter="url(#glow-node)" />
      <circle cx="20" cy="20" r="3" fill="#0A0A0A" />
      
      <!-- Date -->
      <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#1A4DFF" letter-spacing="1">JUL 2023 — PRESENT</text>
      
      <!-- Content Card -->
      <g transform="translate(50, 40)" filter="url(#shadow-soft)">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="6s" begin="3s" repeatCount="indefinite" />
        <rect width="800" height="70" rx="12" fill="url(#glass-bg)" stroke="url(#glass-border)" stroke-width="1" />
        <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#EDEDED">B.Tech Computer Science &amp; Engineering</text>
        <text x="360" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#71717A">@ Lovely Professional University</text>
        
        <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">Focusing on algorithms, system architecture, and backend infrastructure. Current CGPA: 7.9.</text>
      </g>
    </g>
  </g>
</svg>
